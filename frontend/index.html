
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search AI Agent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #202124;
        }

        header {
            background: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            color: #2563eb;
            font-size: 26px;
        }

        header p {
            color: #666;
            margin-bottom: 0;
        }

        main {
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background: white;
            padding: 12px;
            border-radius: 14px;
            box-shadow: 0 4px 20px #0000000d;
        }

        input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            padding: 12px;
            font-size: 16px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 14px;
            margin-top: 24px;
            box-shadow: 0 4px 20px #0000000d;
        }

        .hidden {
            display: none;
        }

        #answer {
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        #sources a {
            display: block;
            color: #2563eb;
            margin-top: 12px;
            overflow-wrap: anywhere;
        }

        #status {
            color: #555;
            margin-top: 18px;
        }

        @media (max-width: 600px) {
            main {
                margin-top: 25px;
            }

            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>AI Search Assistant</h1>
        <p>Search the web and get AI-powered answers.</p>
    </header>

    <main>
        <form id="searchForm" class="search-box">
            <input
                id="question"
                type="text"
                placeholder="Ask anything..."
                required
            >
            <button id="askButton" type="submit">Ask AI</button>
        </form>

        <p id="status" role="status"></p>

        <section id="answerCard" class="card hidden">
            <h2>AI Answer</h2>
            <div id="answer"></div>

            <h3>Sources</h3>
            <div id="sources"></div>
        </section>
    </main>

    <script>
        const form = document.getElementById("searchForm");
        const questionInput = document.getElementById("question");
        const askButton = document.getElementById("askButton");
        const status = document.getElementById("status");
        const answerCard = document.getElementById("answerCard");
        const answerElement = document.getElementById("answer");
        const sourcesElement = document.getElementById("sources");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const question = questionInput.value.trim();

            if (!question) {
                status.textContent = "Please enter a question.";
                return;
            }

            askButton.disabled = true;
            status.textContent = "Searching the web and generating your answer...";
            answerCard.classList.add("hidden");
            sourcesElement.replaceChildren();

            try {
                const url = new URL(
                    "http://127.0.0.1:8000/ask"
                );

                url.searchParams.set("query", question);

                const response = await fetch(url);

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Something went wrong."
                    );
                }

                answerElement.textContent = data.answer || "No answer returned.";

                for (const source of data.sources || []) {
                    if (!source.url) {
                        continue;
                    }

                    try {
                        const parsedUrl = new URL(source.url);

                        if (
                            parsedUrl.protocol !== "https:" &&
                            parsedUrl.protocol !== "http:"
                        ) {
                            continue;
                        }

                        const link = document.createElement("a");
                        link.href = parsedUrl.href;
                        link.textContent = source.title || parsedUrl.hostname;
                        link.target = "_blank";
                        link.rel = "noopener noreferrer";

                        sourcesElement.appendChild(link);
                    } catch {
                        // Ignore invalid source URLs.
                    }
                }

                answerCard.classList.remove("hidden");
                status.textContent = "Answer ready!";

            } catch (error) {
                status.textContent =
                    "Error: " + error.message +
                    " Check that your backend is running.";
            } finally {
                askButton.disabled = false;
            }
        });
    </script>
</body>
</html>
